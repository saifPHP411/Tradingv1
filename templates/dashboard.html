<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consensus Trader</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 40%, #020617 100%); min-height: 100vh; color: #e2e8f0; }
  .glass { background: rgba(30,41,59,0.55); backdrop-filter: blur(20px); border: 1px solid rgba(148,163,184,0.12); border-radius: 1.25rem; }
  .gradient-text { background: linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,0.7);} 70%{box-shadow:0 0 0 10px rgba(52,211,153,0);} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0);} }
  .tab-btn { padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #94a3b8; white-space: nowrap; }
  .tab-btn.active { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .tab-pane { display: none; } .tab-pane.active { display: block; }
  input { background: rgba(15,23,42,0.6); border: 1px solid rgba(148,163,184,0.2); border-radius: 10px; padding: 10px 12px; color: #e2e8f0; width: 100%; font-size: 14px; }
  input:focus { outline: none; border-color: #60a5fa; }
  .slider { -webkit-appearance: none; height: 4px; background: rgba(148,163,184,0.2); border-radius: 2px; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #60a5fa; cursor: pointer; }
</style>
</head>
<body class="p-4">

<header class="flex items-center justify-between mb-4">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl">🤖</div>
    <div>
      <h1 class="text-lg font-extrabold gradient-text leading-tight">Consensus</h1>
      <p class="text-[10px] text-slate-400">3 وكلاء · إجماع</p>
    </div>
  </div>
  <div class="glass px-3 py-1.5 text-xs flex items-center gap-2">
    <span id="pulseDot" class="pulse-dot" style="background:#64748b"></span>
    <span id="statusText">متوقف</span>
  </div>
</header>

<button id="toggleBtn" onclick="toggleRun()" class="w-full py-4 rounded-2xl mb-3 font-bold text-lg transition-all active:scale-95" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); box-shadow: 0 10px 40px -10px rgba(139,92,246,0.5);">
  ▶ تشغيل الوكيل
</button>

<div class="glass px-4 py-2 mb-4 flex items-center justify-between text-xs">
  <div class="flex items-center gap-2">
    <span id="monitorDot" class="pulse-dot" style="background:#64748b"></span>
    <span id="monitorText">المراقب: —</span>
  </div>
  <button onclick="toggleMonitor()" id="monitorBtn" class="px-3 py-1 rounded-lg font-semibold" style="background:rgba(100,116,139,0.3);color:#cbd5e1">تشغيل</button>
</div>

<div class="flex gap-2 mb-4 overflow-x-auto pb-1">
  <button class="tab-btn active" onclick="switchTab('overview', this)">📊 نظرة</button>
  <button class="tab-btn" onclick="switchTab('positions', this)">💼 صفقاتي</button>
  <button class="tab-btn" onclick="switchTab('decisions', this)">📋 قرارات</button>
  <button class="tab-btn" onclick="switchTab('exits', this)">🚪 خروج</button>
  <button class="tab-btn" onclick="switchTab('settings', this)">⚙️ إعدادات</button>
</div>

<!-- ================= نظرة ================= -->
<div id="tab-overview" class="tab-pane active space-y-4">
  <div class="grid grid-cols-2 gap-3">
    <div class="glass p-4"><p class="text-[10px] text-slate-400 mb-1">رأس المال</p><p class="text-xl font-extrabold" id="equity">—</p></div>
    <div class="glass p-4"><p class="text-[10px] text-slate-400 mb-1">P&L اليوم</p><p class="text-xl font-extrabold" id="pnl">—</p><p class="text-[10px] text-slate-500" id="pnlPct">—</p></div>
    <div class="glass p-4"><p class="text-[10px] text-slate-400 mb-1">مراكز مفتوحة</p><p class="text-xl font-extrabold" id="positions">—</p></div>
    <div class="glass p-4"><p class="text-[10px] text-slate-400 mb-1">صفقات اليوم</p><p class="text-xl font-extrabold" id="trades">—</p></div>
  </div>
  <div class="glass p-4">
    <h3 class="text-xs font-bold text-slate-300 mb-2">📈 منحنى رأس المال</h3>
    <div class="h-48"><canvas id="equityChart"></canvas></div>
  </div>
  <div id="currentWork" class="glass p-4 hidden">
    <p class="text-xs text-slate-400 mb-1">يعمل الآن على</p>
    <p class="text-base font-bold text-blue-400" id="currentSymbol">—</p>
  </div>
</div>

<!-- ================= صفقاتي ================= -->
<div id="tab-positions" class="tab-pane space-y-3">
  <div id="positionsList"><div class="glass p-6 text-center text-slate-500 text-sm">لا صفقات مفتوحة</div></div>
</div>

<!-- ================= قرارات ================= -->
<div id="tab-decisions" class="tab-pane space-y-2">
  <div id="decisionsList"><p class="text-slate-500 text-sm text-center">لا قرارات بعد</p></div>
</div>

<!-- ================= خروج ================= -->
<div id="tab-exits" class="tab-pane space-y-2">
  <div id="exitsList"><p class="text-slate-500 text-sm text-center">لا قرارات خروج بعد</p></div>
</div>

<!-- ================= إعدادات ================= -->
<div id="tab-settings" class="tab-pane space-y-4">
  <div class="glass p-4 space-y-4">
    <h3 class="font-bold text-sm">⚙️ الإعدادات المباشرة</h3>
    <div>
      <label class="text-xs text-slate-400 block mb-1">نسبة الثقة المطلوبة: <span id="confVal" class="text-blue-400 font-bold">0.65</span></label>
      <input type="range" id="minConfidence" class="slider w-full" min="0.3" max="0.95" step="0.05" value="0.65" oninput="document.getElementById('confVal').textContent=this.value">
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">مخاطرة لكل صفقة (نسبة من 1)</label>
      <input type="number" id="maxRisk" min="0.005" max="0.2" step="0.005" value="0.02">
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">الرموز (مفصولة بفاصلة)</label>
      <input type="text" id="symbols" value="AAPL,NVDA,AMD,ASML,CRM,PANW,TSLA,JNJ,LLY,AMZN">
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">فاصل الدورة (دقائق)</label>
      <input type="number" id="cycleInterval" min="1" max="120" value="15">
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">رأس المال المخصص للتداول ($) — 0 = رصيد الحساب</label>
      <input type="number" id="tradingCapital" min="0" step="100" value="0" placeholder="0">
    </div>

    <div class="border-t border-slate-700/50 pt-3 mt-3">
      <p class="text-xs font-bold text-slate-300 mb-2">🛡️ إعدادات المراقبة والخروج</p>
      <div class="space-y-2">
        <div>
          <label class="text-xs text-slate-400 block mb-1">فاصل الفحص الحتمي (ثانية)</label>
          <input type="number" id="exitCheckSeconds" min="15" max="300" value="60">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">فاصل وكيل الخروج (ثانية)</label>
          <input type="number" id="exitLlmInterval" min="60" max="1800" value="300">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">حد الخسارة القصوى %</label>
          <input type="number" id="hardStop" min="1" max="30" step="0.5" value="8">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">حد الربح القصوى %</label>
          <input type="number" id="hardTarget" min="2" max="100" step="0.5" value="15">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">تفعيل التريلينغ بعد ربح %</label>
          <input type="number" id="trailActivate" min="0" max="50" step="0.5" value="5">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">مسافة التريلينغ %</label>
          <input type="number" id="trailDistance" min="0.5" max="20" step="0.5" value="3">
        </div>
        <label class="flex items-center gap-2 mt-3 text-xs text-slate-400">
          <input type="checkbox" id="allowExtended" class="w-4 h-4">
          السماح بالإغلاق في الجلسات الممتدة
        </label>
      </div>
    </div>

    <div class="flex items-center justify-between pt-2 border-t border-slate-700/50">
      <div>
        <p class="text-sm font-semibold">وضع التنفيذ</p>
        <p class="text-[10px] text-slate-400">تبديل بين تجريبي وفعلي (ورقي)</p>
      </div>
      <button id="dryRunToggle" onclick="toggleDryRun()" class="px-3 py-1.5 rounded-lg text-xs font-bold">—</button>
    </div>
    <button onclick="saveSettings()" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-500 to-purple-600 font-bold text-sm active:scale-95 transition">💾 حفظ الإعدادات</button>
  </div>
</div>

<script>
let chart = null;
const fmt = n => "$" + Number(n||0).toLocaleString("en-US", {maximumFractionDigits:2});

function switchTab(name, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ================= تشغيل/إيقاف الوكيل ================= */
function updateRunUI(running, currentSymbol) {
  const btn = document.getElementById('toggleBtn');
  const text = document.getElementById('statusText');
  const dot = document.getElementById('pulseDot');
  const work = document.getElementById('currentWork');
  if (running) {
    btn.innerHTML = '⏸ إيقاف الوكيل';
    btn.style.background = 'linear-gradient(135deg, #ef4444, #f97316)';
    btn.style.boxShadow = '0 10px 40px -10px rgba(239,68,68,0.5)';
    text.textContent = 'يعمل'; text.style.color = '#34d399';
    dot.style.background = '#34d399';
    work.classList.remove('hidden');
    if (currentSymbol) document.getElementById('currentSymbol').textContent = currentSymbol;
  } else {
    btn.innerHTML = '▶ تشغيل الوكيل';
    btn.style.background = 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
    btn.style.boxShadow = '0 10px 40px -10px rgba(139,92,246,0.5)';
    text.textContent = 'متوقف'; text.style.color = '';
    dot.style.background = '#64748b';
    work.classList.add('hidden');
  }
}

async function toggleRun() {
  const btn = document.getElementById('toggleBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/run/toggle', {method:'POST'});
    const d = await r.json();
    updateRunUI(d.running);
  } catch(e) { console.error(e); }
  btn.disabled = false;
}

/* ================= المراقب ================= */
function updateMonitorUI(running) {
  const dot = document.getElementById('monitorDot');
  const txt = document.getElementById('monitorText');
  const btn = document.getElementById('monitorBtn');
  if (running) {
    dot.style.background = '#34d399';
    txt.textContent = 'المراقب: نشط 24/7';
    txt.style.color = '#34d399';
    btn.textContent = 'إيقاف';
    btn.style.background = 'rgba(239,68,68,0.2)';
    btn.style.color = '#fca5a5';
  } else {
    dot.style.background = '#64748b';
    txt.textContent = 'المراقب: متوقف';
    txt.style.color = '';
    btn.textContent = 'تشغيل';
    btn.style.background = 'rgba(100,116,139,0.3)';
    btn.style.color = '#cbd5e1';
  }
}

async function toggleMonitor() {
  try {
    const r = await fetch('/api/monitor/toggle', {method:'POST'});
    const d = await r.json();
    updateMonitorUI(d.running);
  } catch(e) { console.error(e); }
}

async function loadMonitor() {
  try {
    const r = await fetch('/api/monitor/status');
    const d = await r.json();
    updateMonitorUI(d.running);
  } catch(e) {}
}

/* ================= الحالة العامة ================= */
async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    document.getElementById('equity').textContent = fmt(d.equity);
    const pnl = d.equity - d.last_equity;
    const pnlPct = d.last_equity ? (pnl/d.last_equity*100) : 0;
    const pnlEl = document.getElementById('pnl');
    pnlEl.textContent = (pnl>=0?'+':'') + fmt(pnl);
    pnlEl.style.color = pnl>=0 ? '#34d399' : '#ef4444';
    document.getElementById('pnlPct').textContent = (pnl>=0?'+':'') + pnlPct.toFixed(2) + '%';
    document.getElementById('positions').textContent = d.open_positions ?? 0;
    document.getElementById('trades').textContent = d.trades_today ?? 0;
    updateRunUI(d.running, d.current_symbol);
    const dry = document.getElementById('dryRunToggle');
    dry.textContent = d.dry_run ? '🟡 تجريبي' : '🟢 فعلي';
    dry.style.background = d.dry_run ? 'rgba(245,158,11,0.2)' : 'rgba(16,185,129,0.2)';
    dry.style.color = d.dry_run ? '#fbbf24' : '#34d399';
  } catch(e) { console.error(e); }
}

/* ================= المراكز ================= */
async function loadPositions() {
  try {
    const r = await fetch('/api/positions');
    const data = await r.json();
    const list = document.getElementById('positionsList');
    if (!Array.isArray(data) || !data.length) {
      list.innerHTML = '<div class="glass p-6 text-center text-slate-500 text-sm">لا صفقات مفتوحة</div>';
      return;
    }
    list.innerHTML = data.map(p => {
      const up = p.unrealized_pl >= 0;
      const color = up ? '#34d399' : '#ef4444';
      return `<div class="glass p-4">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-base">${p.symbol}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-md" style="background:rgba(96,165,250,0.15);color:#60a5fa">${p.side}</span>
          </div>
          <span class="font-bold" style="color:${color}">${up?'+':''}${fmt(p.unrealized_pl)}</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div><p class="text-[10px] text-slate-400">الكمية</p><p class="font-semibold">${p.qty}</p></div>
          <div><p class="text-[10px] text-slate-400">الدخول</p><p class="font-semibold">${fmt(p.avg_entry_price)}</p></div>
          <div><p class="text-[10px] text-slate-400">الحالي</p><p class="font-semibold">${fmt(p.current_price)}</p></div>
        </div>
        <div class="mt-2 text-xs" style="color:${color}">${up?'▲':'▼'} ${p.unrealized_plpc.toFixed(2)}% · القيمة ${fmt(p.market_value)}</div>
      </div>`;
    }).join('');
  } catch(e) { console.error(e); }
}

/* ================= منحنى رأس المال ================= */
async function loadEquity() {
  try {
    const r = await fetch('/api/equity?limit=200');
    const data = await r.json();
    const labels = data.map(x => new Date(x.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}));
    const values = data.map(x => x.equity);
    if (chart) { chart.data.labels = labels; chart.data.datasets[0].data = values; chart.update('none'); return; }
    const ctx = document.getElementById('equityChart').getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,200);
    grad.addColorStop(0,'rgba(96,165,250,0.4)'); grad.addColorStop(1,'rgba(96,165,250,0)');
    chart = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{ data: values, borderColor:'#60a5fa', backgroundColor:grad, fill:true, tension:0.35, pointRadius:0, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => fmt(c.parsed.y) } } },
        scales:{ x:{ grid:{color:'rgba(148,163,184,0.06)'}, ticks:{color:'#64748b',maxTicksLimit:5,font:{size:9}} },
                 y:{ grid:{color:'rgba(148,163,184,0.06)'}, ticks:{color:'#64748b',callback:v=>'$'+v,font:{size:9}} } } }
    });
  } catch(e) { console.error(e); }
}

/* ================= القرارات ================= */
async function loadDecisions() {
  try {
    const r = await fetch('/api/decisions?limit=30');
    const data = await r.json();
    const list = document.getElementById('decisionsList');
    if (!data.length) { list.innerHTML = '<p class="text-slate-500 text-sm text-center">لا قرارات بعد</p>'; return; }
    list.innerHTML = data.map(d => {
      const dec = d.final_decision || '—';
      const color = dec.includes('BUY') ? '#34d399' : dec.includes('SELL') ? '#ef4444' : dec.includes('VETO') ? '#fbbf24' : '#94a3b8';
      const time = new Date(d.timestamp).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'});
      const conf = d.analyst_confidence_display;
      const confTxt = (conf === null || conf === undefined)
        ? 'ثقة غير متاحة'
        : 'ثقة ' + (conf*100).toFixed(0) + '%';
      const score = d.analyst_signal_score;
      const scoreTxt = (score === null || score === undefined)
        ? 'درجة —' : 'درجة ' + score;
      const stageTxt = d.analyst_llm_called === false
        ? (d.analyst_gate_stage === 'regime' ? 'سوق هابط'
           : d.analyst_gate_stage === 'input' ? 'بيانات غير صالحة'
           : 'درجة الإشارة')
        : '';
      const reasonTxt = d.analyst_reason ? String(d.analyst_reason) : '';
      return `<div class="glass p-3 text-xs">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2"><span class="text-slate-500">${time}</span><span class="font-bold">${d.symbol}</span></div>
          <span style="color:${color}" class="font-bold">${dec}</span>
        </div>
        <div class="flex items-center justify-between text-slate-400">
          <span>${confTxt} · ${scoreTxt}${stageTxt ? ' · ' + stageTxt : ''}</span>
          ${d.consensus_reached ? '<span style="color:#34d399">✓ إجماع</span>' : '<span style="color:#fbbf24">✗ لا إجماع</span>'}
        </div>
        ${reasonTxt ? `<div class="mt-1 text-slate-500">${reasonTxt}</div>` : ''}
      </div>`;
    }).join('');
  } catch(e) { console.error(e); }
}

/* ================= قرارات الخروج ================= */
async function loadExits() {
  try {
    const r = await fetch('/api/exits?limit=30');
    const data = await r.json();
    const list = document.getElementById('exitsList');
    if (!data.length) { list.innerHTML = '<p class="text-slate-500 text-sm text-center">لا قرارات خروج بعد</p>'; return; }
    list.innerHTML = data.map(e => {
      const dec = e.decision || '—';
      const color = dec === 'CLOSE_NOW' ? '#ef4444' : dec === 'CLOSE_FAILED' ? '#fbbf24' : '#94a3b8';
      const time = new Date(e.timestamp).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'});
      const pnl = e.pnl_pct >= 0 ? '+' + e.pnl_pct.toFixed(2) : e.pnl_pct.toFixed(2);
      return `<div class="glass p-3 text-xs">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2"><span class="text-slate-500">${time}</span><span class="font-bold">${e.symbol}</span></div>
          <span style="color:${color}" class="font-bold">${dec}</span>
        </div>
        <div class="flex items-center justify-between text-slate-400 mb-1">
          <span>P&L: ${pnl}%</span>
          <span>دخول ${fmt(e.entry_price)} → ${fmt(e.price)}</span>
        </div>
        <p class="text-slate-300 mt-1">${e.reason || ''}</p>
      </div>`;
    }).join('');
  } catch(e) { console.error(e); }
}

/* ================= الإعدادات ================= */
async function loadSettings() {
  try {
    const r = await fetch('/api/settings');
    const s = await r.json();
    document.getElementById('minConfidence').value = s.min_confidence;
    document.getElementById('confVal').textContent = s.min_confidence;
    document.getElementById('maxRisk').value = s.max_risk_per_trade;
    document.getElementById('symbols').value = s.symbols.join(',');
    document.getElementById('cycleInterval').value = s.cycle_interval_minutes;
    document.getElementById('tradingCapital').value = s.trading_capital;
    document.getElementById('exitCheckSeconds').value = s.exit_check_seconds;
    document.getElementById('exitLlmInterval').value = s.exit_llm_interval_seconds;
    document.getElementById('hardStop').value = s.hard_stop_loss_pct;
    document.getElementById('hardTarget').value = s.hard_take_profit_pct;
    document.getElementById('trailActivate').value = s.trailing_activation_pct;
    document.getElementById('trailDistance').value = s.trailing_stop_pct;
    document.getElementById('allowExtended').checked = s.allow_extended_hours;
  } catch(e) { console.error(e); }
}

async function saveSettings() {
  const payload = {
    min_confidence: parseFloat(document.getElementById('minConfidence').value),
    max_risk_per_trade: parseFloat(document.getElementById('maxRisk').value),
    symbols: document.getElementById('symbols').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
    cycle_interval_minutes: parseInt(document.getElementById('cycleInterval').value),
    trading_capital: parseFloat(document.getElementById('tradingCapital').value) || 0,
    exit_check_seconds: parseInt(document.getElementById('exitCheckSeconds').value),
    exit_llm_interval_seconds: parseInt(document.getElementById('exitLlmInterval').value),
    hard_stop_loss_pct: parseFloat(document.getElementById('hardStop').value),
    hard_take_profit_pct: parseFloat(document.getElementById('hardTarget').value),
    trailing_activation_pct: parseFloat(document.getElementById('trailActivate').value),
    trailing_stop_pct: parseFloat(document.getElementById('trailDistance').value),
    allow_extended_hours: document.getElementById('allowExtended').checked,
  };
  try {
    await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    alert('✅ تم الحفظ');
    loadSettings();
  } catch(e) { alert('فشل: ' + e); }
}

async function toggleDryRun() {
  const s = await (await fetch('/api/settings')).json();
  if (s.dry_run && !confirm('⚠️ تحويل إلى التنفيذ الفعلي (ورقي). متأكد؟')) return;
  await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dry_run: !s.dry_run}) });
  loadStatus();
}

/* ================= التحديث الدوري ================= */
function loadAll() {
  loadStatus();
  loadPositions();
  loadEquity();
  loadDecisions();
  loadExits();
}

loadAll();
loadSettings();
loadMonitor();
setInterval(loadAll, 5000);
setInterval(loadMonitor, 10000);
</script>
